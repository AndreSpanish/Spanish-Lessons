const STEPQ=[
 "Is there a trigger + que (a wish, emotion, doubt or advice), or ojalá / para que / antes de que?",
 "Is it imaginary, a “would” situation? (si tuviera / pudiera, yo que tú, me gustaría, dijo que…)",
 "When does it happen: later, now (or as a habit), or in the past?",

const STEPA={y:"Yes",n:"No",later:"Later",now:"Now, or as a habit",past:"In the past",once:"One finished event",bg:"Background, a habit, or in progress"};
const PAIRS=[["PR","I","Pretérito vs. Imperfecto"],["F","C","Futuro vs. Condicional"],["P","S","Presente vs. Subjuntivo"]];

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=new Set(store.get("qte-seen",[]));
let stats=store.get("qte-stats",{});
for(const k in stats){const s=stats[k];if(s.n!==undefined&&s.nt===undefined){s.nt=s.n;s.nc=s.n;delete s.n}}
let enabled=new Set(store.get("qte-enabled",ORDER).filter(t=>ORDER.includes(t)));
if(!enabled.size) ORDER.forEach(t=>enabled.add(t));

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?¿¡]/g,"");
const bare=s=>norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
const same=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));

let round=[],idx=0,picked=null,checked=false,results=[],hintI=0,hinted=false;

function eff(){return enabled.size===1?"conj":mode}
function focusLabel(){
  if(enabled.size===6) return "All six tenses";
  for(const [a,b,l] of PAIRS) if(same(enabled,new Set([a,b]))) return l;
  return ORDER.filter(t=>enabled.has(t)).map(t=>TENSES[t].name).join(" + ")+(enabled.size===1?" only":"");
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newRound(){
  let pool=BANK.filter(q=>enabled.has(q.t));
  let fresh=pool.filter(q=>!seen.has(q.id));
  if(fresh.length<10){pool.forEach(q=>seen.delete(q.id));fresh=pool.slice()}
  round=shuffle(fresh).slice(0,10);idx=0;results=[];
  $("#setup").hidden=true;$("#quiz").hidden=false;
  renderQ();
}

function sentenceHTML(q,fill){
  const [a,b]=q.s.split("___");
  const mid=fill?`<mark>${esc(fill)}</mark>`:`<span class="blank" aria-label="blank">&nbsp;</span>`;
  return esc(a)+mid+esc(b)+(fill?"":` <span class="verb">(${esc(q.v)})</span>`);
}

function tableHTML(t){
  const F=FORMS[t];
  return `<div class="ftable" style="--tc:${COLOR[t]}"><div class="scroll"><table><thead><tr><th>${TENSES[t].name}</th><th>hablar</th><th>comer</th><th>vivir</th></tr></thead><tbody>${PERSONS.map((p,i)=>`<tr><th>${p}</th>${F.rows[i].map(f=>`<td>${f}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="note">${F.note} Reflexive pronouns: me, te, se, nos, se.</p></div>`;
}

function hintSteps(q){
  const p=PATH[q.t],en=[...enabled],out=[];
  for(let k=0;k<p.length;k++){
    const pre=p.slice(0,k).join();
    const cands=en.filter(t=>PATH[t].length>k&&PATH[t].slice(0,k).join()===pre);
    if(new Set(cands.map(t=>PATH[t][k])).size>1) out.push({q:STEPQ[k],a:STEPA[p[k]]});
  }
  return out;
}

function renderQ(){
  const q=round[idx],m=eff();
  picked=m==="conj"?q.t:null;checked=false;hintI=0;hinted=false;

   <div class="trans"><button class="link" id="enBtn" type="button" aria-expanded="false">Show English</button><p class="en" id="enTxt" hidden>${esc(q.en)}</p></div>

     <div class="chips c${cols}">${shown.map(t=>`<button type="button" class="chip" data-t="${t}" aria-pressed="false" style="--c:${COLOR[t]}"><b>${TENSES[t].name}</b><small>${TENSES[t].en}</small></button>`).join("")}</div>
     <div class="hintbox"><button class="ghost small" id="hintBtn" type="button">Walk me through it</button><ol class="hints" id="hints"></ol></div>
   </div>`:`<div class="given" style="--tc:${COLOR[q.t]}"><span class="tag">${TENSES[q.t].name}</span> ${TENSES[q.t].en}</div>${tableHTML(q.t)}`}

     <p class="step-label">${m==="conj"?"Conjugate":"2 · Conjugate"} <em>${esc(q.v)}</em></p>
     <form class="answer-row" id="f" autocomplete="off">
       <input id="ans" type="text" spellcheck="false" autocapitalize="off" placeholder="Type the verb form" aria-label="Your answer">
       <button class="primary" id="check" type="submit">Check</button>
     </form>
     <div class="accents">${["á","é","í","ó","ú","ñ"].map(c=>`<button type="button" data-c="${c}" aria-label="Insert ${c}">${c}</button>`).join("")}</div>

   <p class="msg" id="msg"></p>
   <div id="fb"></div>`;
  $("#chg").onclick=showSetup;
  $("#enBtn").onclick=()=>{const t=$("#enTxt"),o=t.hidden;t.hidden=!o;$("#enBtn").textContent=o?"Hide English":"Show English";$("#enBtn").setAttribute("aria-expanded",o)};
  document.querySelectorAll(".chip[data-t]").forEach(b=>b.onclick=()=>{
    if(checked)return;picked=b.dataset.t;
    document.querySelectorAll(".chip[data-t]").forEach(c=>c.setAttribute("aria-pressed",c===b));
    $("#msg").textContent="";
    if(m==="spot")check();else $("#ans").focus();
  });
  if($("#hintBtn")) $("#hintBtn").onclick=()=>showHint(q);
  document.querySelectorAll(".accents button").forEach(b=>b.onclick=()=>{const i=$("#ans");const s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
  if($("#f")){$("#f").onsubmit=e=>{e.preventDefault();if(!checked)check()};$("#ans").focus({preventScroll:true})}
}

function showHint(q){
  if(checked)return;
  const steps=hintSteps(q);hinted=true;
  const list=$("#hints"),btn=$("#hintBtn");
  if(hintI<steps.length){
    const s=steps[hintI];
    list.insertAdjacentHTML("beforeend",`<li><span class="hq">${esc(s.q)}</span><span class="ha">${esc(s.a)}</span></li>`);
    hintI++;
    btn.textContent=hintI<steps.length?"Next step":"So which tense is it?";
  }else{
    list.insertAdjacentHTML("beforeend",`<li class="final" style="--tc:${COLOR[q.t]}"><span class="ha">It's the <b>${TENSES[q.t].name}</b>. Clue: ${esc(q.clue)}.</span></li>`);
    btn.hidden=true;
  }
}

function check(){
  const q=round[idx],m=eff(),val=$("#ans")?$("#ans").value:"";
  if(m!=="conj"&&!picked){$("#msg").textContent="Pick a tense first.";return}
  if(m!=="spot"&&!val.trim()){$("#msg").textContent="Type your answer.";return}
  checked=true;
  const tOk=m==="conj"?null:picked===q.t;
  let cOk=null,accent=false;
  if(m!=="spot"){
    cOk=false;
    if(q.a.some(a=>norm(a)===norm(val)))cOk=true;
    else if(q.a.some(a=>bare(a)===bare(val))){cOk=true;accent=true}
  }
  results.push({q,picked,val,tOk,cOk,accent,hinted});
  seen.add(q.id);store.set("qte-seen",[...seen]);
  const st=stats[q.t]||(stats[q.t]={nt:0,t:0,nc:0,c:0});
  if(tOk!==null){st.nt++;if(tOk)st.t++}
  if(cOk!==null){st.nc++;if(cOk)st.c++}
  store.set("qte-stats",stats);

  document.querySelectorAll(".chip[data-t]").forEach(c=>{c.disabled=true;if(c.dataset.t===q.t)c.classList.add("right");else if(c.dataset.t===picked)c.classList.add("wrong")});
  if($("#hintBtn"))$("#hintBtn").hidden=true;
  if($("#ans")){$("#ans").readOnly=true;$(".accents").hidden=true;$("#check").hidden=true}
  $("#msg").textContent="";
  const T=TENSES[q.t];
  const pills=[];
  if(tOk!==null)pills.push(`<span class="pill ${tOk?"ok":"no"}">Tense: ${tOk?"correct":"it's "+T.name}</span>`);
  if(cOk!==null)pills.push(`<span class="pill ${cOk?(accent?"almost":"ok"):"no"}">Verb: ${cOk?(accent?"right, check the accent":"correct"):"not quite"}</span>`);
  if(hinted)pills.push(`<span class="pill hintp">Used a hint</span>`);
  const last=idx===round.length-1;
  $("#fb").innerHTML=`<div class="feedback">
    <div class="verdicts">${pills.join("")}</div>
    <p class="full">${sentenceHTML(q,q.a[0])}</p>
    <p class="en">${esc(q.en)}</p>
    <p class="why" style="--tc:${COLOR[q.t]}"><span class="tag">${T.name}.</span> Clue: <strong>${esc(q.clue)}</strong>. ${T.rule}</p>
    ${m!=="conj"?`<details class="tdet"><summary>${T.name} endings</summary>${tableHTML(q.t)}</details>`:""}
    <div class="foot"><button class="primary" id="nextBtn" type="button">${last?"See results":"Next"}</button></div>
  </div>`;
  $("#nextBtn").onclick=next;$("#nextBtn").focus();
}

function next(){idx++;idx<round.length?renderQ():renderResults()}

function renderResults(){
  const tA=results.filter(r=>r.tOk!==null),cA=results.filter(r=>r.cOk!==null);
  const tiles=[];
  if(tA.length)tiles.push(`<div class="score"><b>${tA.filter(r=>r.tOk).length}/${tA.length}</b><span>tenses spotted</span></div>`);
  if(cA.length)tiles.push(`<div class="score"><b>${cA.filter(r=>r.cOk).length}/${cA.length}</b><span>verbs conjugated</span></div>`);
  const h=results.filter(r=>r.hinted).length;
  const miss=results.filter(r=>r.tOk===false||r.cOk===false||r.accent||r.hinted);
  const detail=r=>{const p=[TENSES[r.q.t].name];if(r.tOk===false)p.push(`you picked ${TENSES[r.picked].name}`);if(r.cOk===false)p.push(`you typed “${esc(r.val)}”`);if(r.accent)p.push("missing accent");if(r.hinted)p.push("used a hint");p.push("clue: "+esc(r.q.clue));return p.join(" · ")};
  $("#quiz").innerHTML=`<div class="results" style="display:flex;flex-direction:column;gap:18px">
    <div class="modeline"><span>${MODES[eff()].name} · ${esc(focusLabel())}</span><button class="link" id="chg" type="button">Change</button></div>
    <h2>Round complete</h2>
    <div class="scores c${tiles.length}">${tiles.join("")}</div>
    ${h?`<p class="note">You used hints on ${h} of ${results.length}. Those still count; they're listed below to look at again.</p>`:""}
    ${miss.length?`<div><p class="step-label">Review these</p><ul class="review">${miss.map(r=>`<li style="--tc:${COLOR[r.q.t]}"><div class="s">${sentenceHTML(r.q,r.q.a[0])}</div><div class="d">${detail(r)}</div></li>`).join("")}</ul></div>`:`<p class="note">A perfect round.</p>`}
    <div class="btns"><button class="primary" id="again" type="button">New round of 10</button><button class="ghost" id="toSetup" type="button">Change practice</button></div>
  </div>`;
  $("#again").onclick=newRound;$("#toSetup").onclick=showSetup;$("#chg").onclick=showSetup;$("#again").focus();
}

function setFocus(set){enabled=new Set(set);store.set("qte-enabled",[...enabled]);round=[];showSetup()}

function showSetup(){
  const pool=BANK.filter(q=>enabled.has(q.t)).length;
  const isAll=enabled.size===6;
  $("#setup").innerHTML=`
   <h2>Practice setup</h2>
   <div><p class="step-label">How to practice</p>
     <div class="modes">${Object.entries(MODES).map(([k,v])=>`<button type="button" class="mode" data-mode="${k}" aria-pressed="${mode===k}"><b>${v.name}</b><span>${v.d}</span></button>`).join("")}</div>
   </div>
   <div class="groups">
     <div><p class="step-label">Everything mixed</p><div class="toggles"><button type="button" class="chip" data-focus="all" aria-pressed="${isAll}" style="--c:var(--accent)"><b>All six tenses</b></button></div></div>
     <div><p class="step-label">Confusing pairs</p><div class="toggles">${PAIRS.map(([a,b,l],i)=>`<button type="button" class="chip pair" data-pair="${i}" aria-pressed="${same(enabled,new Set([a,b]))}" style="--c:${COLOR[a]};--c2:${COLOR[b]}"><b>${l}</b></button>`).join("")}</div></div>
     <div><p class="step-label">One tense at a time</p><div class="toggles">${ORDER.map(t=>`<button type="button" class="chip" data-one="${t}" aria-pressed="${enabled.size===1&&enabled.has(t)}" ${mode==="spot"?"disabled":""} style="--c:${COLOR[t]}"><b>${TENSES[t].name}</b></button>`).join("")}</div>
     ${mode==="spot"?`<p class="note" style="margin-top:6px">Spotting needs at least two tenses to choose between, so single tenses are off in this mode.</p>`:`<p class="note" style="margin-top:6px">With one tense, the tense is given and its endings table is shown.</p>`}</div>
   </div>
   <p class="note">${pool} sentences in this mix · ${seen.size} of ${BANK.length} seen so far. New rounds use sentences you haven't seen yet.</p>
   <div class="btns"><button class="primary" id="start" type="button">Start a round of 10</button></div>
   <div><p class="step-label">How you're doing, by tense</p>
     <div class="stats">${ORDER.map(t=>{const s=stats[t]||{};const pct=s.nt?Math.round(s.t/s.nt*100):(s.nc?Math.round(s.c/s.nc*100):0);const parts=[];if(s.nt)parts.push(`spotted ${s.t}/${s.nt}`);if(s.nc)parts.push(`verb ${s.c}/${s.nc}`);return `<div class="stat" style="--tc:${COLOR[t]}"><span>${TENSES[t].name}</span><div class="track"><i style="width:${pct}%"></i></div><span class="n">${parts.join(" · ")||"not yet"}</span></div>`}).join("")}</div>
   </div>
   <details><summary>The four questions</summary><ol class="guideq">${STEPQ.map((s,i)=>`<li>${esc(s)}<span class="note"> ${["Yes → Subjuntivo","Yes → Condicional","Later → Futuro · Now → Presente · Past → question 4","Finished → Pretérito · Background → Imperfecto"][i]}</span></li>`).join("")}</ol></details>
   <details><summary>Tense guide and endings</summary><div class="guide">${ORDER.map(t=>`<div style="--tc:${COLOR[t]}"><b>${TENSES[t].name}</b> (${TENSES[t].en}). ${TENSES[t].rule}<br><span class="note">Clues: ${TENSES[t].clues}.</span>${tableHTML(t)}</div>`).join("")}</div></details>
   <div class="btns"><button class="ghost" id="reset" type="button">Reset progress</button></div>`;
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.set("qte-mode",mode);if(mode==="spot"&&enabled.size===1){enabled=new Set(ORDER);store.set("qte-enabled",[...enabled])}round=[];showSetup()});
  document.querySelector("[data-focus]").onclick=()=>setFocus(ORDER);
  document.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{const p=PAIRS[+b.dataset.pair];setFocus([p[0],p[1]])});
  document.querySelectorAll("[data-one]").forEach(b=>b.onclick=()=>setFocus([b.dataset.one]));
  $("#start").onclick=newRound;
  $("#reset").onclick=()=>{const b=$("#reset");if(b.dataset.armed){seen=new Set();stats={};store.set("qte-seen",[]);store.set("qte-stats",{});showSetup()}else{b.dataset.armed=1;b.textContent="Click again to reset"}};
  $("#quiz").hidden=true;$("#setup").hidden=false;
  $("#setupBtn").textContent="Back to practice";
}

$("#setupBtn").onclick=()=>{
  if($("#setup").hidden){showSetup()}
  else{$("#setupBtn").textContent="Practice setup";$("#setup").hidden=true;$("#quiz").hidden=false;if(!round.length)newRound()}
};
const _nr=newRound;newRound=function(){$("#setupBtn").textContent="Practice setup";_nr()};
newRound();
</script>

</body></html>
